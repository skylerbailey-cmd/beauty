# Publishes the marketing site in /site to GitHub Pages.
#
# Only runs when something in /site changes, so ordinary work on the POS never
# triggers a website deploy.
name: Publish sky-sale.com

on:
  push:
    branches: [claude/vibrant-ramanujan-GiDAq]
    paths: ['site/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
